<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Keeper Builds</title>
    <style>
        /* Use the same root variables as other pages */
        :root {
            --primary-bg: #1a1a1a;
            --secondary-bg: #242424;
            --accent-color: #646cff;
            --accent-hover: #747bff;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .build-card {
            background: var(--secondary-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .build-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .build-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0;
        }

        .build-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1rem 0;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
        }

        .stat-value {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .build-interface {
            background: var(--secondary-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-top: 2rem;
        }

        .build-form {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .action-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .action-button {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .action-button.primary {
            background: var(--accent-color);
            color: white;
        }

        .action-button.secondary {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .action-button.danger {
            background: #dc2626;
            color: white;
        }

        .action-button.info {
            background: #2563eb;
            color: white;
        }

        .action-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-select {
            padding: 0.5rem;
            background: var(--secondary-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
        }

        .create-build {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .create-build:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-bar {
            padding: 0.8rem;
            width: 300px;
            background: var(--secondary-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-button">← Back to Calculator</a>
            <input type="text" class="search-bar" placeholder="Search builds...">
            <a href="/?from=builds" class="create-build">Create New Build</a>
        </div>

        <div class="filters">
            <select class="filter-select">
                <option value="">Sort By</option>
                <option value="dps">Highest DPS</option>
                <option value="popular">Most Popular</option>
                <option value="recent">Most Recent</option>
            </select>
            <select class="filter-select">
                <option value="">Weapon Type</option>
                <option value="melee">Melee</option>
                <option value="ranged">Ranged</option>
                <option value="magic">Magic</option>
            </select>
        </div>

        <div class="builds-grid">
            <!-- Example build card -->
            <div class="build-card">
                <div class="build-header">
                    <h3 class="build-title">High DPS Melee Build</h3>
                    <span class="build-author">by Player123</span>
                </div>
                <div class="build-stats">
                    <div class="stat-item">
                        <div class="stat-value">1,234</div>
                        <div class="stat-label">DPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">19</div>
                        <div class="stat-label">Level</div>
                    </div>
                </div>
                <div class="build-actions">
                    <button class="action-button primary" onclick="loadBuild('${build.id}')">
                        Load Build
                    </button>
                    <button class="action-button info" onclick="shareBuild('${build.id}')">
                        Share
                    </button>
                </div>
            </div>
            <!-- More build cards will be added dynamically -->
        </div>
    </div>

    <script>
        // Add this to handle build loading and sharing
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/builds');
                const builds = await response.json();
                
                // Populate builds grid
                const buildsGrid = document.querySelector('.builds-grid');
                builds.forEach(build => {
                    const buildCard = createBuildCard(build);
                    buildsGrid.appendChild(buildCard);
                });
            } catch (error) {
                console.error('Error loading builds:', error);
            }
        });

        function createBuildCard(build) {
            // Create build card HTML
            const card = document.createElement('div');
            card.className = 'build-card';
            card.innerHTML = `
                <div class="build-header">
                    <h3 class="build-title">${build.name}</h3>
                    <span class="build-author">by ${build.author}</span>
                </div>
                <div class="build-stats">
                    <div class="stat-item">
                        <div class="stat-value">${build.dps.toFixed(0)}</div>
                        <div class="stat-label">DPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${build.level}</div>
                        <div class="stat-label">Level</div>
                    </div>
                </div>
                <div class="build-actions">
                    <button class="action-button primary" onclick="loadBuild('${build.id}')">
                        Load Build
                    </button>
                    <button class="action-button info" onclick="shareBuild('${build.id}')">
                        Share
                    </button>
                </div>
            `;
            return card;
        }

        function loadBuild(buildId) {
            // Redirect to calculator with build ID
            window.location.href = `/?build=${buildId}`;
        }

        function shareBuild(buildId) {
            // Copy share link to clipboard
            const shareUrl = `${window.location.origin}/?build=${buildId}`;
            navigator.clipboard.writeText(shareUrl);
            alert('Build link copied to clipboard!');
        }
    </script>
</body>
</html>
