<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Builds - Core Keeper</title>
    <style>
        /* Use same root variables as other pages */
        :root {
            --primary-bg: #1a1a1a;
            --secondary-bg: #242424;
            --accent-color: #646cff;
            --accent-hover: #747bff;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .builds-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .build-column {
            background: var(--secondary-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--accent-color);
        }

        .build-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0;
        }

        .stats-grid {
            display: grid;
            gap: 1rem;
        }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            text-align: right;
            color: var(--accent-color);
        }

        .difference-better {
            color: #10b981;
        }

        .difference-worse {
            color: #ef4444;
        }

        .add-build {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 2px dashed var(--accent-color);
            color: var(--accent-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .add-build:hover {
            background: rgba(100, 108, 255, 0.1);
        }

        .build-selector {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--accent-color);
            color: var(--text-primary);
        }

        .back-button::before {
            content: '←';
            margin-right: 0.5rem;
        }

        h1 {
            text-align: center;
            background: linear-gradient(120deg, var(--accent-color), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .chart-container {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--secondary-bg);
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-button">Back to Calculator</a>
        </div>
        
        <h1>Compare Builds</h1>

        <div class="builds-container">
            <!-- Build Column Template -->
            <div class="build-column">
                <div class="build-header">
                    <h3 class="build-title">Build 1</h3>
                    <button onclick="removeBuild(this)">×</button>
                </div>
                <select class="build-selector" onchange="loadBuild(this)">
                    <option value="">Select a build...</option>
                </select>
                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="stat-label">DPS</span>
                        <span class="stat-value">1,234.5</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Damage/Hit</span>
                        <span class="stat-value">234.5</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Attack Speed</span>
                        <span class="stat-value">1.5/s</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Crit Chance</span>
                        <span class="stat-value">15%</span>
                    </div>
                </div>
            </div>

            <!-- Add Build Button -->
            <button class="add-build" onclick="addBuildColumn()">
                + Add Build to Compare
            </button>
        </div>

        <!-- Chart for visual comparison -->
        <div class="chart-container">
            <canvas id="comparisonChart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let builds = [];
        let chart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load available builds
                const response = await fetch('/api/builds');
                builds = await response.json();
                
                // Populate build selectors
                updateBuildSelectors();
                
                // Initialize chart
                initChart();
            } catch (error) {
                console.error('Error loading builds:', error);
            }
        });

        function addBuildColumn() {
            const container = document.querySelector('.builds-container');
            const addButton = document.querySelector('.add-build');
            
            const column = document.createElement('div');
            column.className = 'build-column';
            column.innerHTML = `
                <div class="build-header">
                    <h3 class="build-title">Build ${document.querySelectorAll('.build-column').length + 1}</h3>
                    <button onclick="removeBuild(this)">×</button>
                </div>
                <select class="build-selector" onchange="loadBuild(this)">
                    <option value="">Select a build...</option>
                    ${builds.map(build => `
                        <option value="${build.id}">${build.name}</option>
                    `).join('')}
                </select>
                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="stat-label">DPS</span>
                        <span class="stat-value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Damage/Hit</span>
                        <span class="stat-value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Attack Speed</span>
                        <span class="stat-value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Crit Chance</span>
                        <span class="stat-value">-</span>
                    </div>
                </div>
            `;
            
            container.insertBefore(column, addButton);
            updateChart();
        }

        function removeBuild(button) {
            button.closest('.build-column').remove();
            updateChart();
        }

        async function loadBuild(select) {
            try {
                const response = await fetch(`/api/builds/${select.value}`);
                const build = await response.json();
                
                const column = select.closest('.build-column');
                updateBuildStats(column, build);
                updateChart();
            } catch (error) {
                console.error('Error loading build:', error);
            }
        }

        function updateBuildStats(column, build) {
            const stats = column.querySelectorAll('.stat-value');
            stats[0].textContent = build.dps.toFixed(1);
            stats[1].textContent = build.damage_per_hit.toFixed(1);
            stats[2].textContent = `${build.attack_speed.toFixed(2)}/s`;
            stats[3].textContent = `${(build.crit_chance * 100).toFixed(1)}%`;
        }

        function initChart() {
            const ctx = document.getElementById('comparisonChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DPS', 'Damage/Hit', 'Attack Speed', 'Crit Chance'],
                    datasets: []
                },
                options: {
                    scales: {
                        r: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!chart) return;

            const columns = document.querySelectorAll('.build-column');
            chart.data.datasets = Array.from(columns).map((column, index) => {
                const stats = column.querySelectorAll('.stat-value');
                return {
                    label: `Build ${index + 1}`,
                    data: [
                        parseFloat(stats[0].textContent) || 0,
                        parseFloat(stats[1].textContent) || 0,
                        parseFloat(stats[2].textContent) || 0,
                        parseFloat(stats[3].textContent) || 0
                    ],
                    borderColor: `hsl(${index * 60}, 70%, 60%)`,
                    backgroundColor: `hsla(${index * 60}, 70%, 60%, 0.2)`
                };
            });
            
            chart.update();
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Listen for weapons data loading
            window.addEventListener('weaponsLoaded', function(e) {
                const weapons = e.detail.weapons;
                updateWeaponSelectors(weapons);
            });
        });

        function updateWeaponSelectors(weapons) {
            const selectors = document.querySelectorAll('.weapon-selector');
            selectors.forEach(selector => {
                selector.innerHTML = `
                    <option value="">Select a weapon...</option>
                    ${weapons.map(weapon => `
                        <option value="${weapon.name}">${weapon.name}</option>
                    `).join('')}
                `;
            });
        }
    </script>
</body>
</html>
